# ==========================================================
#  Config OpenClash - Mr Dudul
#  Core: Clash Meta (mihomo)
#  Pindah server: cukup edit proxy_provider/proxy.yaml
# ==========================================================

mode: rule
log-level: warning
ipv6: false
allow-lan: true
unified-delay: true
tcp-concurrent: true
find-process-mode: "off"
keep-alive-interval: 15
keep-alive-idle: 30

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:7874
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localdomain"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.pool.ntp.org"
    - "time.*.com"
    - "ntp.*.com"
    - "+.stun.*.*"
    - "stun.*.*"
    - "stun.*.*.*"
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "+.xboxlive.com"
  default-nameserver:
    - 8.8.8.8
    - 1.1.1.1
  nameserver:
    - 8.8.8.8
    - 1.1.1.1
  proxy-server-nameserver:
    - 8.8.8.8
    - 1.1.1.1

# ---------------------------------------------------------
#  Akun VPN ada di file ini. Ganti server = edit file ini saja.
# ---------------------------------------------------------
proxy-providers:
  PROXIES:
    type: file
    path: "./proxy_provider/proxy.yaml"
    health-check:
      enable: true
      url: http://www.google.co.id/generate_204
      interval: 300
      timeout: 3000
      lazy: true
      expected-status: 204

# ---------------------------------------------------------
#  Grup. Tiap grup bisa pilih akun sendiri; default ikut
#  Global, jadi tidak perlu dipilih ulang saat ganti server.
# ---------------------------------------------------------
proxy-groups:
  - name: ⚡ Best Ping
    type: url-test
    use:
      - PROXIES
    url: http://www.google.co.id/generate_204
    interval: 300
    timeout: 3000
    tolerance: 50
    lazy: true
    expected-status: 204

  - name: 🌍 Global
    type: select
    proxies:
      - ⚡ Best Ping
      - DIRECT
    use:
      - PROXIES

  - name: 🏦 Bank
    type: select
    proxies:
      - 🌍 Global
      - ⚡ Best Ping
      - DIRECT
      - REJECT
    use:
      - PROXIES

  - name: 💬 Sosmed
    type: select
    proxies:
      - 🌍 Global
      - ⚡ Best Ping
      - DIRECT
      - REJECT
    use:
      - PROXIES

  - name: 🎬 Streaming
    type: select
    proxies:
      - 🌍 Global
      - ⚡ Best Ping
      - DIRECT
      - REJECT
    use:
      - PROXIES

  - name: 🎮 Games
    type: select
    proxies:
      - 🌍 Global
      - ⚡ Best Ping
      - DIRECT
      - REJECT
    use:
      - PROXIES

  - name: 📦 Lainnya
    type: select
    proxies:
      - 🌍 Global
      - ⚡ Best Ping
      - DIRECT
      - REJECT
    use:
      - PROXIES

  - name: 🛡️ Ads Block
    type: select
    proxies:
      - REJECT
      - DIRECT
      - 🌍 Global

# ---------------------------------------------------------
#  Daftar domain ada di folder rule_provider/ (8 file).
#  Tambah domain = edit file yang sesuai, tidak perlu ubah ini.
# ---------------------------------------------------------
rule-providers:
  Direct:
    type: file
    behavior: classical
    path: "./rule_provider/direct.yaml"
  Bank:
    type: file
    behavior: classical
    path: "./rule_provider/bank.yaml"
  Ads:
    type: file
    behavior: domain
    path: "./rule_provider/adblock.yaml"
  Reject:
    type: file
    behavior: classical
    path: "./rule_provider/reject.yaml"
  Lainnya:
    type: file
    behavior: classical
    path: "./rule_provider/lainnya.yaml"
  Sosmed:
    type: file
    behavior: classical
    path: "./rule_provider/sosmed.yaml"
  Streaming:
    type: file
    behavior: classical
    path: "./rule_provider/streaming.yaml"
  Games:
    type: file
    behavior: classical
    path: "./rule_provider/games.yaml"

rules:
  - RULE-SET,Direct,DIRECT
  - RULE-SET,Bank,🏦 Bank
  - RULE-SET,Ads,🛡️ Ads Block
  - RULE-SET,Reject,🛡️ Ads Block
  - RULE-SET,Lainnya,📦 Lainnya
  - RULE-SET,Sosmed,💬 Sosmed
  - RULE-SET,Streaming,🎬 Streaming
  - RULE-SET,Games,🎮 Games
  - MATCH,🌍 Global
