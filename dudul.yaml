# ==========================================================
#  Config OpenClash Full Rule - Mr Dudul
#  Core: Clash Meta (mihomo)
# ==========================================================

mode: rule
log-level: warning
ipv6: false
allow-lan: true

# --- Bikin ping (delay test) lebih imut & koneksi lebih cepat ---
unified-delay: true        # ping dihitung tanpa handshake TLS/WS -> angka lebih kecil & stabil
tcp-concurrent: true       # konek ke semua IP hasil DNS sekaligus, ambil yang paling cepat
find-process-mode: "off"    # router tidak perlu cek proses, hemat CPU
keep-alive-interval: 15
keep-alive-idle: 30

profile:
  store-selected: true     # pilihan akun di dashboard tidak hilang setelah restart
  store-fake-ip: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:7874
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localdomain"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.pool.ntp.org"
    - "time.*.com"
    - "time.*.gov"
    - "ntp.*.com"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "stun.*.*"
    - "stun.*.*.*"
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "xbox.*.microsoft.com"
    - "+.xboxlive.com"
    - "localhost.ptlogin2.qq.com"
  default-nameserver:
    - 8.8.8.8
    - 1.1.1.1
  nameserver:
    - 8.8.8.8
    - 1.1.1.1
    - 8.8.4.4
  proxy-server-nameserver:
    - 8.8.8.8
    - 1.1.1.1

proxy-providers:
  PROXIES:
    type: file
    path: "./proxy_provider/proxy.yaml"
    health-check:
      enable: true
      url: http://www.google.co.id/generate_204
      interval: 300
      timeout: 3000
      lazy: true
      expected-status: 204

proxy-groups:
  # Otomatis pilih akun dengan ping paling kecil
  - name: ⚡ Best Ping
    type: url-test
    use:
      - PROXIES
    url: http://www.google.co.id/generate_204
    interval: 300
    timeout: 3000
    tolerance: 50
    lazy: true
    expected-status: 204

  - name: 🌍 Global
    type: select
    proxies:
      - ⚡ Best Ping
      - 🚀 Direct
    use:
      - PROXIES

  - name: 🛡️ Ads Block
    type: select
    proxies:
      - ⛔ Reject
      - 🚀 Direct
      - 🌍 Global

  - name: 💸 E-Wallet
    type: select
    proxies:
      - 🌍 Global
      - ⚡ Best Ping
      - 🚀 Direct
      - ⛔ Reject
    use:
      - PROXIES

  - name: 🏦 Bank Lokal
    type: select
    proxies:
      - 🌍 Global
      - ⚡ Best Ping
      - 🚀 Direct
      - ⛔ Reject
    use:
      - PROXIES

  - name: 🤖 AI
    type: select
    proxies:
      - 🌍 Global
      - ⚡ Best Ping
      - 🚀 Direct
      - ⛔ Reject
    use:
      - PROXIES

  - name: 🎥 Meeting Kerja
    type: select
    proxies:
      - 🌍 Global
      - ⚡ Best Ping
      - 🚀 Direct
      - ⛔ Reject
    use:
      - PROXIES

  - name: 🛒 Marketplace
    type: select
    proxies:
      - 🌍 Global
      - ⚡ Best Ping
      - 🚀 Direct
      - ⛔ Reject
    use:
      - PROXIES

  - name: 💬 Sosmed
    type: select
    proxies:
      - 🌍 Global
      - ⚡ Best Ping
      - 🚀 Direct
      - ⛔ Reject
    use:
      - PROXIES

  - name: 🎵 TikTok
    type: select
    proxies:
      - 🌍 Global
      - ⚡ Best Ping
      - 🚀 Direct
      - ⛔ Reject
    use:
      - PROXIES

  - name: 📺 Video Premium
    type: select
    proxies:
      - 🌍 Global
      - ⚡ Best Ping
      - 🚀 Direct
      - ⛔ Reject
    use:
      - PROXIES

  - name: 📥 Update Download
    type: select
    proxies:
      - 🌍 Global
      - ⚡ Best Ping
      - 🚀 Direct
      - ⛔ Reject
    use:
      - PROXIES

  - name: 🎬 Streaming
    type: select
    proxies:
      - 🌍 Global
      - ⚡ Best Ping
      - 🚀 Direct
      - ⛔ Reject
    use:
      - PROXIES

  - name: 🎮 Games
    type: select
    proxies:
      - 🌍 Global
      - ⚡ Best Ping
      - 🚀 Direct
      - ⛔ Reject
    use:
      - PROXIES

  # Pembungkus DIRECT/REJECT bawaan supaya tampil dengan emoji
